<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas Resize</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/gameCountDown.css">
    <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                background: #fff;
            }
            .canvas-container {
                position: relative;
                width: 800px;
                height: 400px;
            }
            canvas {
                border: 2px solid black;
                border-radius: 15px;
                width: 100%;
                height: 100%;
                z-index: 1;
            }
            h1 {
                color: black;
            }
    </style>
</head>
<body>
    <h1>Canvas</h1>
    <div class="controls" style="margin-bottom:12px;">
        <button id="btn-friend">Play with Friend</button>
        <button id="btn-ai">Play with AI</button>
    </div>
    <div class="canvas-container">
        <!-- Canvas is created dynamically by main.ts -->
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
